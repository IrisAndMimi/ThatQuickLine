<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動態對話框範例</title>
    <link rel="stylesheet" href="styles.css">
	<script src="data/return_msg_storage.js"></script>
    <script src="custom_js/chat-functions.js"></script>
    <script src="custom_js/copy_Date.js"></script>
    <script src="custom_js/shopee.js"></script>
    <script src="custom_js/cmd_clipboard.js"></script>
</head>
<body>
    <div class="chat-container">
        <!-- 對話框標題，替換為下拉選單 -->
        <div class="chat-header">
            <select id="chat-header-select" onchange="updateActionButtons()">
                <option value="">ChatGPT 動態對話框</option>
                <option value="剪貼簿">剪貼簿</option>
                <option value="複製日期">複製日期</option>
                <option value="蝦皮口令">蝦皮口令</option>
                <option value="爬地圖">爬地圖</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <!-- 對話內容區域 -->
        <div class="chat-content">
            <div class="chat-bubble user">
                <div class="bubble user">這是一個範例的使用者訊息。</div>
            </div>
            <div class="chat-bubble assistant">
                <div class="bubble assistant">這是一個範例的助理回覆訊息。</div>
            </div>
        </div>
        <!-- 輸入框與送出按鈕 -->
        <div class="chat-footer">
            <input type="text" placeholder="輸入訊息...">
            <button>送出</button>
        </div>
    </div>
    <!-- 其他功能按鈕 -->
	<div class="action-buttons" id="action-buttons"></div>
</body>
</html>
